name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every platform's result rather than stopping at the first
      # failure — a Windows-only break is exactly what this matrix is for.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The strongest check we have: mcp-doctor audits itself, spawning a real
      # MCP server over stdio. It must find nothing. If a rule starts firing on
      # our own tool definitions, that is a regression worth failing the build.
      - name: Self-audit
        run: npm run selftest
